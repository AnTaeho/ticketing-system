spring:
  application:
    name: ticketing-system

  profiles:
    default: local

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false

  task:
    scheduling:
      pool:
        size: 6                # 예매 @Scheduled 6개

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      status:
        order: DOWN, OUT_OF_SERVICE, DEGRADED, UNKNOWN, UP
        http-mapping:          # 하나라도 적으면 기본 매핑이 사라지므로 DOWN·OUT_OF_SERVICE도 적는다
          DOWN: 503
          OUT_OF_SERVICE: 503
          DEGRADED: 200
  health:
    redis:
      enabled: false           # 기본 연결은 타임아웃이 없어 장애 때 60초 붙잡는다. 예매 연결로 보는 bookingRedis가 대신한다

booking:
  seed:
    enabled: true              # @Profile("local")에서만 의미. 예매 테스트는 false
  redis:
    command-timeout: 300ms
    connect-timeout: 500ms
    database: 0                # 예매 키만 쓰는 Redis DB 번호. 테스트는 1을 써서 로컬 앱 키와 섞이지 않게 한다
  hold:
    ttl: 5m
    max-seats: 4
    expiry-scan-ms: 1000
    expiry-batch-size: 50
    rehold-cooldown: 10m
  payment:
    pay-deadline: 10m
    requested-recheck-after: 30s
    unknown-recheck-after: 10s
    not-found-cancel-after: 30s
    reconcile-scan-ms: 2000
    reconcile-batch-size: 20
  gate:
    enabled: true              # 부하 테스트 비교 스위치
    fallback-max-concurrency: 8      # Hikari 풀(10)보다 작게
  queue:
    capacity: 200
    processing-token-ttl: 10m
    waiting-token-ttl: 60m
    promote-interval-ms: 1000
    required: true             # false면 선점이 처리열 토큰을 확인·소모하지 않는다(부하 테스트의 Redis 없음 기준선용)
  seatmap:
    snapshot-interval-ms: 1000
    snapshot-ttl: 30s
    local-cache-ms: 1000
    lease-ttl: 2s
  outbox:
    poll-interval-ms: 500
    batch-size: 50
    lock-duration: 60s
    max-attempts: 5
  ops:
    orphan-scan-ms: 30000
  pg:
    base-url: ""               # 비우면 http://localhost:${local.server.port}/fake-pg
    connect-timeout: 500ms
    read-timeout: 3s
  fake-pg:
    delay-min-ms: 200
    delay-max-ms: 1200
    decline-rate: 0.1
    slow-rate: 0.05
    slow-delay-ms: 5000
